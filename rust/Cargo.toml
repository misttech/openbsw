# The Rust port of Eclipse OpenBSW's libraries: one crate per upstream library under
# libs/bsw, host-testable, with no external dependencies. See README.md and PORTING.md.
[workspace]
resolver = "3"
members = ["util", "timer", "async", "lifecycle", "logger"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
openbsw-util = { path = "util" }
openbsw-timer = { path = "timer" }
openbsw-async = { path = "async" }
openbsw-lifecycle = { path = "lifecycle" }
openbsw-logger = { path = "logger" }

# The firmware builds optimized, as the C++ build does (-O2); keep debug info for the
# ELF and panic = "abort" since there is no unwinder on the target.
[profile.dev]
panic = "abort"
opt-level = 2
debug = true
codegen-units = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = true
codegen-units = 1
